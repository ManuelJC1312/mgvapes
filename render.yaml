services:
  - type: web
    name: mgvapes
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn mgVapes.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: mgvapes.onrender.com
